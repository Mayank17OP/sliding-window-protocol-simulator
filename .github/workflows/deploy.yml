# Pages is configured to publish main/ (legacy branch source). Its own Pages
# build/deploy workflow publishes the committed dist/ directory automatically.
# This workflow verifies that the committed bundle matches the source.
name: Verify GitHub Pages bundle
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed Pages files are up to date
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --ignored --exclude-standard dist)"
